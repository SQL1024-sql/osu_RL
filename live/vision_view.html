<!doctype html>
<html><head><meta charset="utf-8"><title>osu_rl vision</title>
<!-- The student's view, served by live.vision_view at http://127.0.0.1:8770/. OBS: Browser source, that URL, 640 x 480
     (not Local file: OBS's browser will not let a file page read the localhost stream). Once loaded it reconnects by
     itself, so it can stay in OBS between runs of vision_play (transparent while nothing streams). -->
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
</style></head>
<body><img id="v" alt="">
<script>
const base = location.protocol === "file:" ? "http://127.0.0.1:8770" : "";
const v = document.getElementById("v");
let up = false;
function connect() { v.src = base + "/stream?t=" + Date.now(); }
v.onerror = () => { up = false; v.style.visibility = "hidden"; };
// heartbeat: a single frame every 2 s; when the server is (back) up and the stream is not, reconnect
setInterval(() => {
  const probe = new Image();
  probe.onload = () => { if (!up) { up = true; v.style.visibility = "visible"; connect(); } };
  probe.onerror = () => { up = false; v.style.visibility = "hidden"; };
  probe.src = base + "/frame.jpg?t=" + Date.now();
}, 2000);
connect();
</script></body></html>
